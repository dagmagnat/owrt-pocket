name: Cudy WR300 v1 firmware
on:
  push:
    paths:
      - firmware/cudy-wr300-v1/**
      - .github/workflows/cudy-wr300.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageBuilder prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 zstd file qemu-user
      - name: Build exact WR300 v1 profile
        env:
          BUILD_WORK: ${{ runner.temp }}/cudy-wr300
          BUILD_OUTPUT: ${{ github.workspace }}/firmware-output
        run: bash firmware/cudy-wr300-v1/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cudy-wr300-v1-25.12.6
          path: firmware-output/
          if-no-files-found: error
          retention-days: 14
